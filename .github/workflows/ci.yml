name: AGBA Security, License & Appwrite 2.6.1 Live Docker CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  static-and-unit-suite:
    name: TypeScript Lint, No-Firestore Import Guard, Unit Suite & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure .env.example Templates Present (If Stripped by Git Exporter)
        run: |
          [ -f .env.example ] || cp docs/env.template .env.example
          [ -f infra/appwrite/.env.example ] || cp infra/appwrite/env.template infra/appwrite/.env.example

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript Strict Typecheck
        run: npm run lint

      - name: Enforce Zero Firestore Imports in Application Code (ADR-008)
        run: npm run check:no-firestore

      - name: Lint Legacy Firestore Rules (Retained Until 14-Day Cutover Window Ends)
        run: npm run lint:rules

      - name: Verify Compose Structure, Optional Services Shedding Report & Backup Scope
        run: npm run report:appwrite-scope

      - name: Validate Appwrite 2.6.1 Manifest & Bootstrap Dry-Run
        run: npm run bootstrap:appwrite

      - name: Auto-Provision Live Appwrite Cloud Frankfurt (6adc7d7a000b5b27d58d) When APPWRITE_API_KEY Secret Is Set
        env:
          NODE_ENV: "production"
          APPWRITE_ENDPOINT: "https://fra.cloud.appwrite.io/v1"
          APPWRITE_PROJECT_ID: "6adc7d7a000b5b27d58d"
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          if [ -n "$APPWRITE_API_KEY" ]; then
            echo "=== Auto-Provisioning Live Appwrite Cloud Frankfurt (Project: 6adc7d7a000b5b27d58d) ===" | tee -a "$GITHUB_STEP_SUMMARY"
            npx tsx scripts/bootstrap-appwrite.ts | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "[INFO] GitHub Secret APPWRITE_API_KEY is not set yet; skipped live Appwrite Cloud Frankfurt (6adc7d7a000b5b27d58d) provisioning." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Unit, License Hygiene, Dev-Only Seed Check, Identity Bridge & Dirty Dozen Suite
        run: npm run verify:phase0

      - name: Build Production Bundle
        run: npm run build

  real-appwrite-2-6-1-integration:
    name: Real Appwrite 2.6.1 Installer Diff + 10 Live Tests + Container Memory Table
    runs-on: ubuntu-latest
    needs: static-and-unit-suite

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure .env.example Templates Present (If Stripped by Git Exporter)
        run: |
          [ -f .env.example ] || cp docs/env.template .env.example
          [ -f infra/appwrite/.env.example ] || cp infra/appwrite/env.template infra/appwrite/.env.example

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Official Appwrite 2.6.1 Installer & Diff Against infra/appwrite/docker-compose.yml
        run: |
          mkdir -p /tmp/appwrite-official-install/appwrite
          docker run --rm \
            --volume /tmp/appwrite-official-install/appwrite:/usr/src/code/appwrite:rw \
            --entrypoint="install" \
            appwrite/appwrite:2.6.1 \
            --interactive=N \
            --no-start=true \
            --http-port=80 \
            --https-port=443 \
            --database=postgresql \
            --topology=combined

          sudo chown -R "$(id -u):$(id -g)" /tmp/appwrite-official-install

          echo "=== 1. Raw Line-by-Line Diff (Official Installer vs. infra/appwrite/docker-compose.yml) ===" | tee -a "$GITHUB_STEP_SUMMARY"
          diff -u /tmp/appwrite-official-install/appwrite/docker-compose.yml infra/appwrite/docker-compose.yml | tee -a "$GITHUB_STEP_SUMMARY" || true

          echo "=== 2. Canonical Docker Compose Config Diff (Must Be Identical) ==="
          cp infra/appwrite/.env.example /tmp/appwrite-official-install/appwrite/.env
          cp infra/appwrite/.env.example infra/appwrite/.env
          cp infra/appwrite/clickhouse-config.xml /tmp/appwrite-official-install/appwrite/clickhouse-config.xml
          cp infra/appwrite/clickhouse-init.sh /tmp/appwrite-official-install/appwrite/clickhouse-init.sh
          cp infra/appwrite/docker-compose.yml /tmp/appwrite-official-install/appwrite/repo-docker-compose.yml

          docker compose --project-directory /tmp/appwrite-official-install/appwrite -f /tmp/appwrite-official-install/appwrite/docker-compose.yml config > /tmp/official-resolved.yml
          docker compose --project-directory /tmp/appwrite-official-install/appwrite -f /tmp/appwrite-official-install/appwrite/repo-docker-compose.yml config > /tmp/repo-resolved.yml
          diff -u /tmp/official-resolved.yml /tmp/repo-resolved.yml
          echo "[PASS] infra/appwrite/docker-compose.yml is 100% identical to the official Appwrite 2.6.1 installer output." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Start Official Unmodified Appwrite 2.6.1 Stack + Separate AGBA Extras
        run: |
          sudo systemctl stop apache2 nginx || true
          chmod +x infra/appwrite/clickhouse-init.sh
          docker compose \
            --project-directory infra/appwrite \
            --env-file infra/appwrite/.env \
            -f infra/appwrite/docker-compose.yml \
            -f infra/agba-extras.docker-compose.yml \
            up -d

      - name: Wait for Appwrite 2.6.1 /v1/health/version Readiness & Ensure Console Schema Migrated
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1/v1/health/version | grep -q "2.6.1"; then
              echo "Appwrite 2.6.1 HTTP endpoint is reachable!"
              break
            fi
            echo "Waiting for Appwrite 2.6.1... ($i/60)"
            sleep 3
          done
          curl -fsS http://127.0.0.1/v1/health/version
          echo ""
          docker compose \
            --project-directory infra/appwrite \
            --env-file infra/appwrite/.env \
            -f infra/appwrite/docker-compose.yml \
            exec -T appwrite migrate || true

      - name: Zero-Touch Bootstrap Appwrite 2.6.1 (10 TablesDB Tables, Columns, Indexes, Bucket & Dev/Test Seed)
        run: |
          NODE_ENV=test \
          APPWRITE_ENDPOINT="http://127.0.0.1/v1" \
          APPWRITE_PROJECT_ID="agba-core" \
          npx tsx scripts/bootstrap-appwrite.ts --auto-init --output-env .env.ci.appwrite

      - name: Run Real-Appwrite 2.6.1 Integration Tests (10 of 10 End-to-End Assertions)
        run: |
          set -a
          source .env.ci.appwrite
          set +a
          NODE_ENV=test npx tsx scripts/verify-appwrite-integration.ts --require-live | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Capture Per-Container Memory Table & Optional Services Shedding Report (<= 9 GB Budget)
        run: |
          echo "" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "=== Real Appwrite 2.6.1 + AGBA Extras Per-Container Memory Table ===" | tee -a "$GITHUB_STEP_SUMMARY"
          docker stats --no-stream --format "table {{.Name}}\t{{.Image}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" | tee -a "$GITHUB_STEP_SUMMARY"
          npx tsx scripts/report-appwrite-memory-and-backup-scope.ts | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build & Boot AGBA Platform Docker Container (Dockerfile) & Verify /api/status
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          echo "=== Building & Starting agba-platform Docker Image ===" | tee -a "$GITHUB_STEP_SUMMARY"
          docker build -t agba-platform:ci .
          docker run -d --name agba-platform-ci \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e APPWRITE_ENDPOINT="https://fra.cloud.appwrite.io/v1" \
            -e APPWRITE_PROJECT_ID="6adc7d7a000b5b27d58d" \
            -e APPWRITE_API_KEY="$APPWRITE_API_KEY" \
            agba-platform:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz | grep -q "ok"; then
              echo "agba-platform container is healthy on port 3000!"
              break
            fi
            sleep 2
          done

          docker logs agba-platform-ci || true
          echo "=== Docker Container /api/status Response ===" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -fsS http://127.0.0.1:3000/api/status | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" | tee -a "$GITHUB_STEP_SUMMARY"
          docker rm -f agba-platform-ci

      - name: Provision Live Appwrite Cloud Frankfurt (Project 6adc7d7a000b5b27d58d)
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          if [ -z "$APPWRITE_API_KEY" ]; then
            echo "No APPWRITE_API_KEY secret set yet — skipping live Frankfurt Cloud sync."
            exit 0
          fi
          echo "=== Syncing 10 TablesDB Tables, Storage Bucket & Seed Data to Appwrite Cloud Frankfurt (6adc7d7a000b5b27d58d) ===" | tee -a "$GITHUB_STEP_SUMMARY"
          NODE_ENV=production \
          APPWRITE_ENDPOINT="https://fra.cloud.appwrite.io/v1" \
          APPWRITE_PROJECT_ID="6adc7d7a000b5b27d58d" \
          npx tsx scripts/bootstrap-appwrite.ts --seed-dev | tee -a "$GITHUB_STEP_SUMMARY"


