# ==============================================================================
# AGBA Extra Services Compose File (Companion to unmodified Appwrite 2.6.1)
# ==============================================================================
# Usage alongside the official unmodified Appwrite 2.6.1 compose file:
#   docker compose \
#     -f infra/appwrite/docker-compose.yml \
#     -f infra/agba-extras.docker-compose.yml \
#     up -d
#
# All images below are pinned to exact version tags + multi-arch (linux/amd64
# and linux/arm64) SHA-256 manifest digests verified on 2026-10-24.
# ==============================================================================

services:
  agba-pgvector:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    container_name: agba-pgvector
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: "10m"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agba_local_pgvector_pass}
      POSTGRES_DB: ${POSTGRES_DB:-agba_vectors}
    ports:
      - "${AGBA_PGVECTOR_PORT:-5433}:5432"
    volumes:
      - agba-pgvector-data:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-agba} -d $${POSTGRES_DB:-agba_vectors}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - appwrite

  agba-redis:
    image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    container_name: agba-redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: "10m"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "${AGBA_REDIS_PORT:-6380}:6379"
    volumes:
      - agba-redis-data:/data:rw
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - appwrite

  agba-mailpit:
    image: axllent/mailpit:v1.21@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
    container_name: agba-mailpit
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: "10m"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/info >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - appwrite

volumes:
  agba-pgvector-data:
  agba-redis-data:
