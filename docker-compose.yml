# ==============================================================================
# AGBA Turnkey Docker Stack (Works NOW with Vercel + Appwrite Cloud Frankfurt)
# No Oracle Cloud or Coolify required — runs in GitHub Actions or Docker Desktop:
#   docker compose up -d --build
# ==============================================================================

services:
  agba-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agba-platform
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-https://fra.cloud.appwrite.io/v1}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:-6adc7d7a000b5b27d58d}
      APPWRITE_DATABASE_ID: ${APPWRITE_DATABASE_ID:-agba_core}
      APPWRITE_BUCKET_ID: ${APPWRITE_BUCKET_ID:-rag_files}
      APPWRITE_API_KEY: ${APPWRITE_API_KEY:-}
      AGBA_MASTER_ENCRYPTION_KEY: ${AGBA_MASTER_ENCRYPTION_KEY:-5bcd3fac71ea95ebc9d4e2778184bdd701f5ddb2bcf3f4511887c0899c795d4a}
      POSTGRES_HOST: agba-pgvector
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-agba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agba_local_pgvector_pass}
      POSTGRES_DB: ${POSTGRES_DB:-agba_vectors}
      REDIS_URL: redis://agba-redis:6379
    volumes:
      - agba_data:/app/data
    depends_on:
      agba-pgvector:
        condition: service_healthy
      agba-redis:
        condition: service_healthy

  # PostgreSQL 16 + pgvector container (768, 1024, and 1536 embedding tables with RLS)
  agba-pgvector:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    container_name: agba-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agba_local_pgvector_pass}
      POSTGRES_DB: ${POSTGRES_DB:-agba_vectors}
    ports:
      - "${AGBA_PGVECTOR_PORT:-5433}:5432"
    volumes:
      - agba_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-agba} -d $${POSTGRES_DB:-agba_vectors}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Redis 7.4 sliding-window rate-limit & quota store
  agba-redis:
    image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    container_name: agba-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "${AGBA_REDIS_PORT:-6380}:6379"
    volumes:
      - agba_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  agba_data:
  agba_pgdata:
  agba_redis_data:
